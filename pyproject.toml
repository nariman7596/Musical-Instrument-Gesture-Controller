[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-midi-controller"
version = "0.1.0"
description = "Turn hand gestures in front of a camera into real-time MIDI control changes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["midi", "mediapipe", "computer-vision", "music", "gesture-recognition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gesture-midi-controller = "main:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
